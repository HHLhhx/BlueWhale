spring:
  datasource:
    url: jdbc:mysql://localhost:3306/BlueWhale?characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
  redis:
    host: localhost
    port: 6379
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s

server:
  port: 8080

aliyun:
  oss:
    endpoint:
    accessKeyId:
    accessKeySecret:
    bucketName:

alipay:
  appId:
  appPrivateKey:
  alipayPublicKey:
  notifyUrl:
  serverUrl:
  returnUrl:


logging:
  level:
    root: INFO
    com.seecoder.BlueWhale: DEBUG
    org.springframework: ERROR
    org.springframework.boot: ERROR
    org.springframework.web: ERROR
    org.springframework.security: ERROR
  file:
    name: logs/app.log
    path: logs

